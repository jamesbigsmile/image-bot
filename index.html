<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Image Bot</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { 
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .container {
            background: white;
            border-radius: 12px;
            padding: 40px;
            max-width: 600px;
            width: 100%;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
        }
        h1 {
            color: #333;
            margin-bottom: 10px;
            font-size: 28px;
        }
        .subtitle {
            color: #666;
            margin-bottom: 30px;
            font-size: 14px;
        }
        .input-group {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }
        input {
            flex: 1;
            padding: 12px;
            border: 2px solid #eee;
            border-radius: 8px;
            font-size: 14px;
            transition: border-color 0.2s;
        }
        input:focus {
            outline: none;
            border-color: #667eea;
        }
        button {
            padding: 12px 24px;
            background: #667eea;
            color: white;
            border: none;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s;
        }
        button:hover {
            background: #5568d3;
        }
        button:disabled {
            background: #ccc;
            cursor: not-allowed;
        }
        .result {
            background: #f8f9fa;
            padding: 20px;
            border-radius: 8px;
            margin-top: 20px;
            display: none;
        }
        .result.show {
            display: block;
        }
        .result h3 {
            color: #333;
            margin-bottom: 10px;
            font-size: 16px;
        }
        .result p {
            color: #666;
            line-height: 1.6;
            font-size: 14px;
        }
        .loading {
            display: none;
            text-align: center;
            color: #667eea;
            margin-top: 20px;
        }
        .loading.show {
            display: block;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🎨 Image Bot</h1>
        <p class="subtitle">Describe an image you want to create</p>
        
        <div class="input-group">
            <input type="text" id="prompt" placeholder="e.g., A sunset over mountains...">
            <button onclick="generateImage()">Generate</button>
        </div>
        
        <div class="loading" id="loading">
            ⏳ Creating...
        </div>
        
        <div class="result" id="result">
            <h3>📝 Description</h3>
            <p id="description"></p>
        </div>
    </div>

    <script>
        const API_URL = 'http://localhost:8000';
        
        function generateImage() {
            const prompt = document.getElementById('prompt').value;
            if (!prompt) return;
            
            document.getElementById('loading').classList.add('show');
            document.getElementById('result').classList.remove('show');
            
            fetch(`${API_URL}/generate`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ prompt })
            })
            .then(r => r.json())
            .then(data => {
                document.getElementById('loading').classList.remove('show');
                document.getElementById('description').textContent = data.description;
                document.getElementById('result').classList.add('show');
            })
            .catch(err => {
                document.getElementById('loading').classList.remove('show');
                alert('Error: ' + err.message);
            });
        }
        
        document.getElementById('prompt').addEventListener('keypress', e => {
            if (e.key === 'Enter') generateImage();
        });
    </script>
</body>
</html>
